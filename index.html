<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在打开音乐...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f; color: #fff;
      font-family: -apple-system, "PingFang SC", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 340px; width: 100%; }
    .loading { font-size: 15px; color: #999; margin-bottom: 24px; }
    .card { display: none; background: #1c1c1e; border-radius: 20px; padding: 32px 22px; }
    .title { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #999; font-size: 13px; margin-bottom: 26px; }
    .btn {
      display: block; width: 100%; padding: 15px; margin: 10px 0;
      border: none; border-radius: 13px; font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none; color: #fff;
    }
    .qq { background: #31c27c; }
    .netease { background: #e72d2d; }
    .web { background: #3a3a3c; }
    .hint { font-size: 12px; color: #666; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="loading" id="loading">🎵 正在为你打开音乐...</div>

    <div class="card" id="card">
      <div class="title" id="songName"></div>
      <div class="sub">选择播放方式</div>
      <a class="btn qq" id="btnQq">用 QQ音乐 打开</a>
      <a class="btn netease" id="btnNetease">用 网易云 打开</a>
      <a class="btn web" id="btnWeb">网页试听</a>
      <div class="hint">iPhone 需点一下按钮才能跳转</div>
    </div>
  </div>

  <script>
    let song = null;
    const id = new URLSearchParams(location.search).get("s");

    // 读取歌曲数据
    fetch('./songs.js?v=' + Date.now())
      .then(r => r.text())
      .then(txt => {
        const m = txt.match(/const SONGS = (\{[\s\S]*\});/);
        const SONGS = new Function('return ' + m[1])();
        song = SONGS[id];
        if (!song) {
          document.getElementById("loading").textContent = "歌曲不存在，请检查 ?s= 参数";
          return;
        }
        document.getElementById("songName").textContent = "🎵 " + song.name;

        const ua = navigator.userAgent.toLowerCase();
        const isIOS = /iphone|ipad|ipod/.test(ua);

        if (isIOS) {
          // iPhone：显示按钮，等用户点
          document.getElementById("loading").style.display = "none";
          document.getElementById("card").style.display = "block";
        } else {
          // 安卓：尝试自动拉起
          autoLaunchAndroid();
        }
      });

    // 安卓自动分发逻辑
    function autoLaunchAndroid() {
      // 1. 优先试 QQ音乐
      const t1 = Date.now();
      const hidden = () => document.hidden || document.webkitHidden;
      let jumped = false;

      const tryQQ = () => {
        if (jumped) return;
        jumped = true;
        window.location.href = song.qqScheme;
      };

      const checkQQ = setInterval(() => {
        if (hidden()) { clearInterval(checkQQ); return; }
        if (Date.now() - t1 > 1500) {
          clearInterval(checkQQ);
          // QQ音乐没装上，试网易云
          tryNetease();
        }
      }, 300);

      tryQQ();

      function tryNetease() {
        if (!song.neteaseScheme) return showCard();
        const t2 = Date.now();
        let j2 = false;
        const go = () => {
          if (j2) return;
          j2 = true;
          window.location.href = song.neteaseScheme;
        };
        const checkNE = setInterval(() => {
          if (document.hidden) { clearInterval(checkNE); return; }
          if (Date.now() - t2 > 1500) {
            clearInterval(checkNE);
            showCard(); // 都没装，留页面
          }
        }, 300);
        go();
      }
    }

    // 兜底：显示手动按钮
    function showCard() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("card").style.display = "block";
    }

    // 按钮事件
    document.getElementById("btnQq").onclick = () => location.href = song.qqWeb;
    document.getElementById("btnNetease").onclick = () => location.href = song.neteaseWeb;
    document.getElementById("btnWeb").onclick = () => location.href = song.qqWeb;
  </script>
</body>
</html>
