<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打开音乐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; 
      background: #0f0f0f; 
      color: #fff; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card { 
      background: #1c1c1e; 
      padding: 36px 24px; 
      border-radius: 20px; 
      max-width: 360px; 
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .title { 
      font-size: 22px; 
      font-weight: 700; 
      margin-bottom: 6px; 
    }
    .sub { 
      color: #999; 
      font-size: 14px; 
      margin-bottom: 28px; 
    }
    .btn { 
      display: block; 
      width: 100%; 
      padding: 16px; 
      margin: 12px 0; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 600; 
      cursor: pointer; 
      text-decoration: none;
      text-align: center;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-qq { background: #31c27c; color: #fff; }
    .btn-netease { background: #e72d2d; color: #fff; }
    .btn-web { background: #3a3a3c; color: #fff; }
    .tip { 
      font-size: 12px; 
      color: #666; 
      margin-top: 20px; 
      line-height: 1.6;
    }
    .error { color: #ff6b6b; }
    .success { color: #31c27c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title" id="songName">加载中...</div>
    <div class="sub" id="subTip">正在读取歌曲信息</div>
    
    <button class="btn btn-qq" id="btnQq">用 QQ音乐 打开</button>
    <button class="btn btn-netease" id="btnNetease">用 网易云 搜索</button>
    <button class="btn btn-web" id="btnWeb">网页试听</button>
    
    <div class="tip" id="tipText">
      没装对应 App 就点网页试听<br>
      iPhone 用户需手动点击按钮
    </div>
  </div>

  <script>
    let currentSong = null;
    const params = new URLSearchParams(location.search);
    const songId = params.get("s");

    // 获取歌曲数据
    fetch('./songs.js?v=' + Date.now())
      .then(r => r.text())
      .then(text => {
        // 用正则从 JS 文件里提取 SONGS 对象
        const match = text.match(/const SONGS = (\{[\s\S]*\});/);
        if (!match) {
          throw new Error("songs.js 格式不对");
        }
        const SONGS = new Function('return ' + match[1])();
        currentSong = SONGS[songId];

        if (!currentSong) {
          document.getElementById("songName").textContent = "歌曲不存在";
          document.getElementById("subTip").innerHTML = 
            '<span class="error">编号 ' + songId + ' 未找到，请检查 songs.js</span>';
          return;
        }

        document.getElementById("songName").textContent = "🎵 " + currentSong.name;
        document.getElementById("subTip").innerHTML = 
          '<span class="success">数据加载成功</span>';
      })
      .catch(err => {
        document.getElementById("songName").textContent = "加载失败";
        document.getElementById("subTip").innerHTML = 
          '<span class="error">' + err.message + '</span>';
        document.getElementById("tipText").innerHTML = 
          '请确认 songs.js 在同级目录且格式正确';
      });

    // 按钮事件
    document.getElementById("btnQq").onclick = function() {
      if (!currentSong) { alert("歌曲数据未加载"); return; }
      // 用官方网页链接，让 QQ音乐自己拉起 App
      window.location.href = currentSong.qqWeb;
    };

    document.getElementById("btnNetease").onclick = function() {
      if (!currentSong) { alert("歌曲数据未加载"); return; }
      // 跳网易云搜索网页
      window.location.href = currentSong.neteaseWeb;
    };

    document.getElementById("btnWeb").onclick = function() {
      if (!currentSong) { alert("歌曲数据未加载"); return; }
      // 网页试听（也是 QQ音乐网页版）
      window.location.href = currentSong.qqWeb;
    };

    // 安卓自动尝试拉起（iPhone 不会触发，因为用户没点击）
    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    if (!isIOS && songId) {
      // 延迟一秒后尝试自动拉起 QQ音乐网页
      setTimeout(() => {
        if (currentSong && currentSong.qqWeb) {
          window.location.href = currentSong.qqWeb;
        }
      }, 1000);
    }
  </script>
</body>
</html>
