<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFC 音乐分发</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #0f1320; color: #fff; margin: 0; }
  #loading { margin-top: 50px; font-size: 16px; color: #aaa; }
  
  /* 视图容器默认隐藏 */
  .view-container { display: none; }
  
  /* 安卓视图样式 */
  #androidView { margin-top: 30px; }
  .play-btn { 
    display: flex; align-items: center; justify-content: center;
    width: 80px; height: 80px; margin: 20px auto; 
    background: #2b95ff; border-radius: 50%; 
    box-shadow: 0 0 20px rgba(43,149,255,0.4);
    font-size: 30px; color: #fff; text-decoration: none;
  }
  .tip-text { color: #888; font-size: 13px; margin-bottom: 30px; }
  #webLink { display: inline-block; color: #2b95ff; text-decoration: none; font-size: 14px; margin-top: 10px; }
  
  /* iPhone视图样式 */
  #iphoneView { margin-top: 20px; }
  #iphoneView h2 { margin-bottom: 25px; font-size: 18px; font-weight: normal; }
  .btn { 
    display: flex; align-items: center;
    width: 85%; margin: 12px auto; padding: 14px 20px; 
    border-radius: 12px; color: #fff; text-decoration: none; font-size: 16px; 
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px); text-align: left;
  }
  .btn-icon { margin-right: 12px; font-size: 20px; }
  #btnQq { border-left: 3px solid #12b7f5; }
  #btnNetease { border-left: 3px solid #d33a31; }
  #btnQishi { border-left: 3px solid #ff0055; }
  #btnKuGou { border-left: 3px solid #00a0e9; }
  #btnKugouYouth { border-left: 3px solid #ff6600; }
  #btnWebIos { background: rgba(0,0,0,0.2); border: none; justify-content: center; margin-top: 25px;}
</style>
</head>
<body>
  <div id="loading">加载中...</div>
  
  <!-- 安卓专属视图 -->
  <div id="androidView" class="view-container">
    <div>正在匹配最佳播放源...</div>
    <a href="javascript:retryLaunch();" class="play-btn">▶</a>
    <div class="tip-text">自动匹配中，未跳转可点击上方按钮重试</div>
    <a href="#" id="webLink">网页在线试听 →</a>
  </div>

  <!-- iPhone专属视图 -->
  <div id="iphoneView" class="view-container">
    <h2>请选择音乐平台</h2>
    <a id="btnQq" class="btn"><span class="btn-icon">🎵</span> QQ音乐</a>
    <a id="btnNetease" class="btn"><span class="btn-icon">☁️</span> 网易云音乐</a>
    <a id="btnQishi" class="btn"><span class="btn-icon">🥤</span> 汽水音乐</a>
    <a id="btnKuGou" class="btn"><span class="btn-icon">🐶</span> 酷狗音乐</a>
    <a id="btnKugouYouth" class="btn"><span class="btn-icon">🎧</span> 酷狗概念版</a>
    <a id="btnWebIos" class="btn"><span class="btn-icon">🌐</span> 网页在线播放(QQ)</a>
  </div>

<script src="songs.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const songId = params.get('s');
  const song = SONGS[songId];
  const ua = navigator.userAgent.toLowerCase();
  const isAndroid = /android/.test(ua);

  if (!song) { 
    document.getElementById("loading").textContent = "歌曲不存在"; 
  } else {
    document.getElementById("loading").style.display = "none";

    if (isAndroid) {
      // 安卓：只显示安卓视图，跑自动队列
      document.getElementById("androidView").style.display = "block";
      document.getElementById("webLink").onclick = () => location.href = song.qqWeb;
      autoLaunchAndroid(song);
    } else {
      // iPhone：只显示iPhone视图，纯手动点
      document.getElementById("iphoneView").style.display = "block";
      
      document.getElementById("btnQq").onclick = () => location.href = song.qqScheme || song.qqWeb;
      document.getElementById("btnNetease").onclick = () => location.href = song.neteaseScheme;
      document.getElementById("btnQishi").onclick = () => location.href = song.qishiScheme;
      document.getElementById("btnKuGou").onclick = () => location.href = song.kugouScheme;
      document.getElementById("btnKugouYouth").onclick = () => location.href = song.kugouyouthScheme;
      document.getElementById("btnWebIos").onclick = () => location.href = song.qqWeb;
    }
  }

  // 安卓手动重试
  function retryLaunch() {
    autoLaunchAndroid(song);
  }

  // ===== 安卓自动分发 =====
  function autoLaunchAndroid(song) {
    const t1 = Date.now();
    let jumped = false;

    const tryQQ = () => {
      if (jumped) return;
      jumped = true;
      location.href = song.qqScheme || song.qqWeb;
    };

    const checkQQ = setInterval(() => {
      if (document.hidden) { clearInterval(checkQQ); return; }
      if (Date.now() - t1 > 1500) {
        clearInterval(checkQQ);
        tryNetease();
      }
    }, 300);
    tryQQ();

    function tryNetease() {
      if (!song.neteaseScheme) return;
      const t2 = Date.now();
      let j2 = false;
      const goNe = () => { if (j2) return; j2 = true; location.href = song.neteaseScheme; };
      const checkNE = setInterval(() => {
        if (document.hidden) { clearInterval(checkNE); return; }
        if (Date.now() - t2 > 1500) { clearInterval(checkNE); tryQishi(); }
      }, 300);
      goNe();
    }

    function tryQishi() {
      if (!song.qishiScheme) return;
      const t3 = Date.now();
      let j3 = false;
      const goQi = () => { if (j3) return; j3 = true; location.href = song.qishiScheme; };
      const checkQi = setInterval(() => {
        if (document.hidden) { clearInterval(checkQi); return; }
        if (Date.now() - t3 > 1500) { clearInterval(checkQi); tryKuGou(); }
      }, 300);
      goQi();
    }

    function tryKuGou() {
      if (!song.kugouScheme) return;
      const t4 = Date.now();
      let j4 = false;
      const goKg = () => { if (j4) return; j4 = true; location.href = song.kugouScheme; };
      const checkKg = setInterval(() => {
        if (document.hidden) { clearInterval(checkKg); return; }
        if (Date.now() - t4 > 1500) { clearInterval(checkKg); tryKugouYouth(); }
      }, 300);
      goKg();
    }

    function tryKugouYouth() {
      if (!song.kugouyouthScheme) return;
      const t5 = Date.now();
      let j5 = false;
      const goKy = () => { if (j5) return; j5 = true; location.href = song.kugouyouthScheme; };
      const checkKy = setInterval(() => {
        if (document.hidden) { clearInterval(checkKy); return; }
        if (Date.now() - t5 > 1500) { clearInterval(checkKy); }
      }, 300);
      goKy();
    }
  }
</script>
</body>
</html>
