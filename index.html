<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC 音乐</title>
<style>
  body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
  .card { background: #1e1e1e; padding: 30px; border-radius: 12px; max-width: 400px; margin: 50px auto; }
  button { display: block; width: 100%; padding: 15px; margin: 15px 0; border: none; border-radius: 8px; font-size: 16px; }
  .qq { background: #31c27c; color: #fff; }
  .netease { background: #d33a31; color: #fff; }
  .web { background: #333; color: #fff; }
</style>
</head>
<body>
  <div class="card" id="content" style="display:none;">
    <h2 id="songName"></h2>
    <p style="color:#31c27c;">数据加载成功</p>
    <button class="qq" id="btnQq">用 QQ音乐 打开</button>
    <button class="netease" id="btnNetease">用 网易云 搜索</button>
    <button class="web" id="btnWeb">网页试听</button>
    <p style="font-size:12px; color:#888;">没装对应 App 就点网页试听</p>
  </div>
  <div id="loading">加载中...</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const songId = urlParams.get('s') || "1";

  fetch('./songs.js?v=' + Date.now())
    .then(r => r.text())
    .then(txt => {
      const m = txt.match(/const SONGS = (\{[\s\S]*\});/);
      const SONGS = new Function('return ' + m[1])();
      const song = SONGS[songId];
      
      if (!song) { document.getElementById("loading").textContent = "歌曲不存在"; return; }
      
      document.getElementById("songName").textContent = "🎵 " + song.name;
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      // 绑定按钮：直接跳官方网页（官方网页会自动拉起App）
      document.getElementById("btnQq").onclick = () => location.href = song.qqWeb;
      document.getElementById("btnNetease").onclick = () => location.href = song.neteaseWeb;
      document.getElementById("btnWeb").onclick = () => location.href = song.qqWeb;
    });
</script>
</body>
</html>
