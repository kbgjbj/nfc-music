<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC 音乐分发</title>
<style>
body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
.container { max-width: 400px; margin: 50px auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
.song { font-size: 24px; margin: 20px 0; }
.status { color: #4caf50; margin-bottom: 20px; }
button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.qq { background: #31c27c; color: #fff; }
.ne { background: #e74c3c; color: #fff; }
.web { background: #333; color: #fff; }
.tip { color: #888; font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <div id="loading">加载中...</div>
  <div id="content" style="display:none;">
    <div class="song" id="songName"></div>
    <div class="status">数据加载成功</div>
    <button class="qq" id="btnQq">用 QQ音乐 打开</button>
    <button class="ne" id="btnNetease">用 网易云 搜索</button>
    <button class="web" id="btnWeb">网页试听</button>
    <div class="tip">没装对应App就点网页试听<br>iPhone 用户需手动点击按钮</div>
  </div>
</div>
<script>
const songId = new URLSearchParams(location.search).get("s") || "3";

fetch('./songs.js?t=' + Date.now())
  .then(r => r.text())
  .then(txt => {
    const m = txt.match(/const SONGS = (\{[\s\S]*\});/);
    const SONGS = new Function('return ' + m[1])();
    const song = SONGS[songId];
    
    if (!song) { document.getElementById("loading").textContent = "歌曲不存在"; return; }
    
    document.getElementById("songName").textContent = "🎵 " + song.name;
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

    // 绑定手动按钮
    document.getElementById("btnQq").onclick = () => location.href = song.qqScheme || song.qqWeb;
    document.getElementById("btnNetease").onclick = () => location.href = song.neteaseScheme || song.neteaseWeb;
    document.getElementById("btnWeb").onclick = () => location.href = song.qqWeb;

    // 安卓自动分发逻辑
    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(ua);
    if (isAndroid) autoLaunchAndroid(song);
  });

function autoLaunchAndroid(song) {
  const t1 = Date.now();
  let jumped = false;

  const tryQQ = () => {
    if (jumped) return;
    jumped = true;
    location.href = song.qqScheme || song.qqWeb;
  };

  const checkQQ = setInterval(() => {
    if (document.hidden) { clearInterval(checkQQ); return; }
    if (Date.now() - t1 > 1500) {
      clearInterval(checkQQ);
      tryNetease();
    }
  }, 300);
  tryQQ();

  function tryNetease() {
    if (!song.neteaseScheme) return;
    const t2 = Date.now();
    let j2 = false;
    
    const goNe = () => {
      if (j2) return;
      j2 = true;
      location.href = song.neteaseScheme || song.neteaseWeb;
    };
    
    const checkNE = setInterval(() => {
      if (document.hidden) { clearInterval(checkNE); return; }
      if (Date.now() - t2 > 1500) {
        clearInterval(checkNE);
      }
    }, 300);
    goNe();
  }
}
</script>
</body>
</html>
