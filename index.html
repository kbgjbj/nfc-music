<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFC 音乐分发</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    text-align: center; 
    padding: 20px; 
    background: #0f172a; 
    color: #fff;
    margin: 0;
  }
  /* 默认全部隐藏，由JS控制显示 */
  #androidView, #iphoneView { display: none; }
  
  /* 安卓视图样式 */
  .play-btn { 
    width: 80px; height: 80px; 
    background: #3b82f6; 
    border-radius: 50%; 
    margin: 40px auto 20px; 
    display: flex; align-items: center; justify-content: center; 
    box-shadow: 0 0 20px rgba(59,130,246,0.5);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 30px; height: 30px; fill: #fff; margin-left: 5px; }
  .tip { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
  #webLink { color: #94a3b8; text-decoration: none; font-size: 14px; display: block; margin-top: 40px; }
  
  /* iPhone视图样式 */
  .title { font-size: 18px; margin-bottom: 30px; font-weight: 500; }
  .btn { 
    display: block; 
    width: 90%; 
    margin: 12px auto; 
    padding: 16px; 
    border-radius: 12px; 
    color: #fff; 
    text-decoration: none; 
    font-size: 16px; 
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    text-align: left;
    backdrop-filter: blur(10px);
  }
  .btn-wrap { display: flex; align-items: center; }
  .btn-icon { margin-right: 12px; font-size: 20px; }
  #btnWebIos { background: rgba(0,0,0,0.3); text-align: center; }
</style>
</head>
<body>
  <div id="loading">加载中...</div>
  
  <!-- 安卓专属视图 -->
  <div id="androidView">
    <div class="tip">正在匹配最佳播放源...</div>
    <div class="play-btn" onclick="retryLaunch()">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="tip">自动匹配中，未跳转可点击上方按钮重试</div>
    <a id="webLink" href="#">网页在线试听 →</a>
  </div>

  <!-- iPhone专属视图 -->
  <div id="iphoneView">
    <div class="title">请选择音乐平台</div>
    <a id="btnQq" class="btn"><span class="btn-wrap"><span class="btn-icon">🎵</span> QQ音乐</span></a>
    <a id="btnNetease" class="btn"><span class="btn-wrap"><span class="btn-icon">☁️</span> 网易云音乐</span></a>
    <a id="btnQishi" class="btn"><span class="btn-wrap"><span class="btn-icon">🥤</span> 汽水音乐</span></a>
    <a id="btnKuGou" class="btn"><span class="btn-wrap"><span class="btn-icon">🐶</span> 酷狗音乐</span></a>
    <a id="btnKugouYouth" class="btn"><span class="btn-wrap"><span class="btn-icon">🎧</span> 酷狗概念版</span></a>
    <a id="btnWebIos" class="btn">🌐 网页在线播放(QQ)</a>
  </div>

<script src="songs.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const songId = params.get('s');
  const song = SONGS[songId];
  const ua = navigator.userAgent.toLowerCase();
  const isAndroid = /android/.test(ua);

  if (!song) { 
    document.getElementById("loading").textContent = "歌曲不存在"; 
  } else {
    document.getElementById("loading").style.display = "none";

    if (isAndroid) {
      // 安卓：显示播放视图，跑自动队列
      document.getElementById("androidView").style.display = "block";
      document.getElementById("webLink").onclick = () => location.href = song.qqWeb;
      autoLaunchAndroid(song);
    } else {
      // iPhone及其他：只显示选择平台视图
      document.getElementById("iphoneView").style.display = "block";
      
      document.getElementById("btnQq").onclick = () => location.href = song.qqScheme || song.qqWeb;
      document.getElementById("btnNetease").onclick = () => location.href = song.neteaseScheme;
      document.getElementById("btnQishi").onclick = () => location.href = song.qishiScheme;
      document.getElementById("btnKuGou").onclick = () => location.href = song.kugouScheme;
      document.getElementById("btnKugouYouth").onclick = () => location.href = song.kugouyouthScheme;
      document.getElementById("btnWebIos").onclick = () => location.href = song.qqWeb;
    }
  }

  // 安卓手动重试
  function retryLaunch() {
    autoLaunchAndroid(song);
  }

  // ===== 安卓自动分发 =====
  function autoLaunchAndroid(song) {
    const t1 = Date.now();
    let jumped = false;

    const tryQQ = () => {
      if (jumped) return;
      jumped = true;
      location.href = song.qqScheme || song.qqWeb;
    };

    const checkQQ = setInterval(() => {
      if (document.hidden) { clearInterval(checkQQ); return; }
      if (Date.now() - t1 > 1500) {
        clearInterval(checkQQ);
        tryNetease();
      }
    }, 300);
    tryQQ();

    function tryNetease() {
      if (!song.neteaseScheme) return;
      const t2 = Date.now();
      let j2 = false;
      const goNe = () => { if (j2) return; j2 = true; location.href = song.neteaseScheme; };
      const checkNE = setInterval(() => {
        if (document.hidden) { clearInterval(checkNE); return; }
        if (Date.now() - t2 > 1500) { clearInterval(checkNE); tryQishi(); }
      }, 300);
      goNe();
    }

    function tryQishi() {
      if (!song.qishiScheme) return;
      const t3 = Date.now();
      let j3 = false;
      const goQi = () => { if (j3) return; j3 = true; location.href = song.qishiScheme; };
      const checkQi = setInterval(() => {
        if (document.hidden) { clearInterval(checkQi); return; }
        if (Date.now() - t3 > 1500) { clearInterval(checkQi); tryKuGou(); }
      }, 300);
      goQi();
    }

    function tryKuGou() {
      if (!song.kugouScheme) return;
      const t4 = Date.now();
      let j4 = false;
      const goKg = () => { if (j4) return; j4 = true; location.href = song.kugouScheme; };
      const checkKg = setInterval(() => {
        if (document.hidden) { clearInterval(checkKg); return; }
        if (Date.now() - t4 > 1500) { clearInterval(checkKg); tryKugouYouth(); }
      }, 300);
      goKg();
    }

    function tryKugouYouth() {
      if (!song.kugouyouthScheme) return;
      const t5 = Date.now();
      let j5 = false;
      const goKy = () => { if (j5) return; j5 = true; location.href = song.kugouyouthScheme; };
      const checkKy = setInterval(() => {
        if (document.hidden) { clearInterval(checkKy); return; }
        if (Date.now() - t5 > 1500) { clearInterval(checkKy); }
      }, 300);
      goKy();
    }
  }
</script>
</body>
</html>
