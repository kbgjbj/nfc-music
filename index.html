<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFC 音乐分发</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #f5f5f5; }
  #content { display: none; margin-top: 30px; }
  .btn { display: block; width: 80%; margin: 10px auto; padding: 15px; border-radius: 8px; color: #fff; text-decoration: none; font-size: 16px; }
  #btnQq { background: #12b7f5; }
  #btnNetease { background: #d33a31; }
  #btnQishi { background: #000000; }
  #btnKuGou { background: #00a0e9; }
  #btnKugouYouth { background: #ff6600; }
  #btnWeb { background: #666; }
</style>
</head>
<body>
  <div id="loading">加载中...</div>
  <div id="content">
    <h2 id="songName"></h2>
    <a id="btnQq" class="btn">QQ音乐</a>
    <a id="btnNetease" class="btn">网易云音乐</a>
    <a id="btnQishi" class="btn">汽水音乐</a>
    <a id="btnKuGou" class="btn">酷狗音乐</a>
    <a id="btnKugouYouth" class="btn">酷狗概念版</a>
    <a id="btnWeb" class="btn">网页在线播放(QQ)</a>
  </div>

<script src="songs.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const songId = params.get('s');
  const song = SONGS[songId];

  if (!song) { 
    document.getElementById("loading").textContent = "歌曲不存在"; 
  } else {
    document.getElementById("songName").textContent = "🎵 " + song.name;
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.getElementById("btnQq").onclick = () => location.href = song.qqScheme || song.qqWeb;
    document.getElementById("btnNetease").onclick = () => location.href = song.neteaseScheme;
    document.getElementById("btnQishi").onclick = () => location.href = song.qishiScheme;
    document.getElementById("btnKuGou").onclick = () => location.href = song.kugouScheme;
    document.getElementById("btnKugouYouth").onclick = () => location.href = song.kugouyouthScheme;
    document.getElementById("btnWeb").onclick = () => location.href = song.qqWeb;

    const ua = navigator.userAgent.toLowerCase();
    if (/android/.test(ua)) {
      autoLaunchAndroid(song);
    }
  }

  function autoLaunchAndroid(song) {
    const t1 = Date.now();
    let jumped = false;

    const tryQQ = () => {
      if (jumped) return;
      jumped = true;
      location.href = song.qqScheme || song.qqWeb;
    };

    const checkQQ = setInterval(() => {
      if (document.hidden) { clearInterval(checkQQ); return; }
      if (Date.now() - t1 > 1500) {
        clearInterval(checkQQ);
        tryNetease();
      }
    }, 300);
    tryQQ();

    function tryNetease() {
      if (!song.neteaseScheme) return;
      const t2 = Date.now();
      let j2 = false;
      
      const goNe = () => {
        if (j2) return;
        j2 = true;
        location.href = song.neteaseScheme;
      };
      
      const checkNE = setInterval(() => {
        if (document.hidden) { clearInterval(checkNE); return; }
        if (Date.now() - t2 > 1500) {
          clearInterval(checkNE);
          tryQishi();
        }
      }, 300);
      goNe();
    }

    function tryQishi() {
      if (!song.qishiScheme) return;
      const t3 = Date.now();
      let j3 = false;
      
      const goQi = () => {
        if (j3) return;
        j3 = true;
        location.href = song.qishiScheme;
      };
      
      const checkQi = setInterval(() => {
        if (document.hidden) { clearInterval(checkQi); return; }
        if (Date.now() - t3 > 1500) {
          clearInterval(checkQi);
          tryKuGou();
        }
      }, 300);
      goQi();
    }

    function tryKuGou() {
      if (!song.kugouScheme) return;
      const t4 = Date.now();
      let j4 = false;
      
      const goKg = () => {
        if (j4) return;
        j4 = true;
        location.href = song.kugouScheme;
      };
      
      const checkKg = setInterval(() => {
        if (document.hidden) { clearInterval(checkKg); return; }
        if (Date.now() - t4 > 1500) {
          clearInterval(checkKg);
          tryKugouYouth();
        }
      }, 300);
      goKg();
    }

    function tryKugouYouth() {
      if (!song.kugouyouthScheme) return;
      const t5 = Date.now();
      let j5 = false;
      
      const goKy = () => {
        if (j5) return;
        j5 = true;
        location.href = song.kugouyouthScheme;
      };
      
      const checkKy = setInterval(() => {
        if (document.hidden) { clearInterval(checkKy); return; }
        if (Date.now() - t5 > 1500) {
          clearInterval(checkKy);
        }
      }, 300);
      goKy();
    }
  }
</script>
</body>
</html>
